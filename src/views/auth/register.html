<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title><%= htmlWebpackPlugin.options.title %> | Story App</title>
    <link rel="icon" href="./favicon.png" />
  </head>
  <body>
    <main class="min-vh-100 d-flex main-content bg-purple">
      <div class="m-auto container py-5">
        <div class="row justify-content-center">
          <div class="col-12 col-md-6 col-lg-6">
            <div class="card shadow-lg border-0 rounded-4 bg-primary">
              <div class="card-body p-4">
                <h1 class="text-center mb-4">Registrasi</h1>

                <form id="registerForm" novalidate>
                  <div class="mb-3">
                    <label for="validationCustomRecordName" class="form-label"
                      >Nama</label
                    >
                    <input-with-validation
                      type="text"
                      inputId="validationCustomRecordName"
                      invalidFeedbackMessage="Wajib diisi"
                      required
                    ></input-with-validation>
                  </div>

                  <div class="mb-3">
                    <label for="validationCustomEmail" class="form-label"
                      >Email</label
                    >
                    <input-with-validation
                      type="email"
                      inputId="validationCustomEmail"
                      invalidFeedbackMessage="Wajib diisi"
                      required
                    ></input-with-validation>
                  </div>

                  <div class="mb-3">
                    <label for="validationCustomPassword" class="form-label"
                      >Password</label
                    >
                    <input-with-validation
                      type="password"
                      inputId="validationCustomPassword"
                      invalidFeedbackMessage="Wajib diisi"
                      required
                    ></input-with-validation>
                  </div>

                  <div class="col-12 text-end">
                    <button class="btn btn-purple" type="submit">Submit</button>
                  </div>
                </form>

                <div class="mt-4 text-center">
                  Sudah punya akun? <a href="/auth/login.html">Login</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
